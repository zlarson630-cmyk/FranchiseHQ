<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Franchise HQ</title><style>
:root{--primary:#4b2e83;--accent:#b7a57a;--soft:#f1ebf8;--ink:#231a35;font-family:system-ui,Arial;color:var(--ink);background:#f7f5fa}*{box-sizing:border-box}body{margin:0}header{background:var(--primary);color:white;padding:20px max(20px,calc((100vw - 1100px)/2))}header h1{margin:0;font-size:28px}header small{color:#f3e6b6}main{max-width:1100px;margin:auto;padding:22px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}button,select,input,textarea{font:inherit;padding:10px;border:1px solid #cbd4e1;border-radius:9px;background:white}button{cursor:pointer}button.active,.primary{background:var(--primary);color:white;border-color:var(--primary)}button.active{box-shadow:inset 0 -3px var(--accent)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card{background:white;border:1px solid #dce2ea;border-radius:13px;padding:18px;margin-bottom:12px}.muted{color:#64748b}.tag{display:inline-block;background:var(--soft);border-radius:20px;padding:4px 9px;font-size:12px;margin:3px}.good{color:#187449}.bad{color:#b13d3d}h2{margin:16px 0}h3{margin:4px 0 8px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.row>*{min-width:0}.wide{flex:1}label{display:block;font-size:12px;color:#536278;margin:8px 0 3px}input,textarea,select{max-width:100%}textarea{width:100%;min-height:100px}.stat{font-size:27px;font-weight:800}.hidden{display:none}@media(max-width:600px){header{padding:18px}main{padding:12px}.card{padding:14px}}
.outlook-scroll{overflow-x:auto;padding-bottom:12px}.outlook-table{display:grid;grid-template-columns:74px repeat(6,minmax(170px,1fr));gap:7px;min-width:1160px}.outlook-head{background:var(--primary);color:#fff;border-bottom:3px solid var(--accent);border-radius:8px;padding:12px 6px;text-align:center;font-weight:800}.outlook-year{background:var(--soft);border-radius:9px;padding:14px 6px;font-weight:800;text-align:center}.outlook-cell{background:#fff;border:1px solid #e1dce8;border-radius:10px;padding:7px;min-height:145px}.outlook-cell select{font-size:11px;width:100%;padding:5px}.mini-card{background:linear-gradient(135deg,var(--primary),#231b36);color:#fff;border-radius:8px;padding:9px;min-height:84px;border-bottom:4px solid var(--accent)}.mini-card .mini-name{font-size:15px;font-weight:800}.mini-card small{color:#f0e2ba}.mini-card .ovr{float:right;background:var(--accent);color:#231a35;border-radius:50%;padding:6px;font-weight:900}.mini-backup{margin-top:7px;font-size:11px;color:#64748b}.outlook-note{font-size:11px;color:#64748b}.outlook-cell select.backup{margin-top:4px}.rating-bubble{float:right;display:inline-flex;align-items:center;justify-content:center;width:39px;height:39px;border-radius:50%;font-size:16px;font-weight:900;color:white;border:2px solid rgba(255,255,255,.75)}.dev-mark{display:inline-flex;gap:4px;align-items:center;font-size:11px;font-weight:700}.dev-icon{font-size:15px}.rating-settings{display:flex;gap:12px;flex-wrap:wrap}.rating-settings label{flex:1;min-width:95px}.rating-settings input{width:100%}.depth-edit{display:none;margin-top:5px}.depth-edit.open{display:block}.depth-edit select{width:100%}.depth-change{border:0;background:transparent;color:#76698d;font-size:10px;padding:3px 1px;cursor:pointer}.backup-line{display:flex;align-items:center;gap:5px;width:100%;padding:7px 6px;margin-top:6px;border:1px solid #d8d0e5;border-radius:7px;background:#f5f1fa;color:#312546;text-align:left;white-space:nowrap;font-size:11px;cursor:pointer}.backup-line .backup-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;font-weight:750}.backup-line .backup-rating{font-weight:850;border-radius:5px;padding:3px 4px;color:#fff}.backup-line .backup-dev{font-size:13px;font-weight:900}.backup-line .risk{color:#b45309}.outlook-cell .mini-card{min-height:95px}.backup-class{font-size:10px;font-weight:750;color:#6d5b86;white-space:nowrap}.backup-line{gap:4px}.backup-line .backup-name{font-size:10.5px}.backup-line .backup-person{display:flex;flex:1;min-width:0;flex-direction:column;gap:2px}.backup-line .backup-name{display:block;white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:break-word;line-height:1.2;font-size:11px}.backup-line .backup-class{display:block;line-height:1.1}.backup-line .backup-rating,.backup-line .backup-dev,.backup-line .risk{flex-shrink:0}.backup-line{min-height:44px}</style><header><h1>FRANCHISE HQ</h1><small>Every franchise has a story. Know yours.</small></header><main><div class="row"><select id="franchise" onchange="chooseFranchise(this.value)"></select><button onclick="addFranchise()">+ Franchise</button><span class="muted" id="status"></span></div><nav id="tabs"></nav><div id="view"></div></main><script>
const initial={id:'washington-2029',name:'Washington Huskies',sport:'College Football',season:'2029',colors:{primary:'#4b2e83',accent:'#b7a57a'},players:[
{name:'Tate Reynolds',pos:'QB',number:'8',year:'RS Junior',overall:82,dev:'Normal',deal:'Playing Time',grade:'A+',required:'C+',transferRisk:'Watch',hometown:'Queen Creek, Arizona',size:"6'2, 223 lb",notes:'High-floor backup quarterback. Transferred from Clemson after the 2026 season to Washington. Throw power 92, throw on the run 85, speed 87, agility 86, awareness 83.'},
{name:'Caleb Scales',pos:'RB',number:'25',year:'RS Sophomore',overall:77,dev:'Elite',archetype:'Elusive Bruiser',hometown:'Kahuku, Hawaii',size:"5'10, 199 lb",nil:65,notes:'Former 3-star'},
{name:'Bobby Jennings',pos:'WR',number:'7',year:'RS Sophomore',overall:86,dev:'Elite',hometown:'West Linn, Oregon',size:"6'5, 209 lb",notes:'Former 4-star. 97 speed, 96 agility, 94 change of direction. He’s a dog.',deal:'Championship Contender',grade:'A-',required:'B-'},
{name:'David Easy',pos:'WR',number:'19',year:'Freshman (redshirt)',dev:'Elite',archetype:'Physical Route Runner',hometown:'Olathe, Kansas',size:"6'2, 206 lb",notes:'4-star',deal:'Pro Potential',grade:'D',required:'C'},
{name:'Clayton Silver',pos:'WR',number:'0',year:'RS Sophomore',overall:91,dev:'Elite',archetype:'Elusive Route Runner',hometown:'Honolulu, Hawaii',size:"5'11, 183 lb",notes:'99 agility, 98 COD, 92 juke, 90 spin, 92 deep route, 89 speed',deal:'Pro Potential',grade:'D',required:'B'},
{name:'George Breeze',pos:'QB',year:'Freshman',overall:82,dev:'Elite',hometown:'Long Beach, California',size:"6'3, 219 lb",nil:310,notes:'Starting QB. 5-star. 96 throw power, 90 deep accuracy, 90 speed, 83 break sack, 85 agility, 82 throw on run',deal:'Playing Time'},
{name:'Cameron Hamiel',pos:'FS',number:'17',year:'RS Junior',archetype:'Box Specialist',hometown:'Detroit, Michigan',size:"5'10, 180 lb",notes:'Defensive captain. 95 awareness, 94 play recognition, 89 zone, 90 speed, 82 acceleration, 88 pursuit, 77 tackle, 87 hit power'},
{name:'Brody Callaway',pos:'C',number:'51',year:'Freshman',overall:74,dev:'Elite',archetype:'Raw Strength',hometown:'San Francisco, California',size:"6'3, 276 lb",nil:180},
{name:'Danny Waddy',pos:'RB',number:'1',year:'Freshman',overall:73,dev:'Elite',archetype:'Backfield Threat',hometown:'Encinitas, California',size:"6'1, 202 lb",nil:100,notes:'91 acceleration, 91 change of direction',deal:'Playing Style',grade:'C',required:'B-'},
{name:'Jamerson Addington',pos:'EDGE',year:'RS Freshman',overall:73,dev:'Elite',archetype:'Pure Power',hometown:'Fresno, California',size:"6'2, 249 lb",nil:110,notes:'85 tackling, 81 hit power, 74 block shedding',deal:'Championship Contender',grade:'A-',required:'B-'},
{name:'Bernie Singletary',pos:'CB',number:'9',year:'RS Freshman',overall:69,dev:'Star',archetype:'Bump and Run',hometown:'Pasco, Washington',size:"6'0, 175 lb",nil:80,notes:'78 man, 93 COD, 86 speed, 88 acceleration',deal:'Pro Potential',grade:'B-',required:'C+'},
{name:'Finau Fox',pos:'DT',number:'99',year:'Freshman',overall:74,dev:'Star',archetype:'Gap Specialist',hometown:'Newport Beach, California',size:"6'5, 332 lb",nil:145,notes:'True nose tackle. Athletic for his size. 82 tackling, 77 block shed, 85 hit power, 80 strength',deal:'Conference Prestige',grade:'A-',required:'B-'}
],recruits:[{name:'Oscar Williams',pos:'C',stars:4,rank:3,archetype:'Agile',hometown:'San Diego, California',size:"6'1, 292 lb",status:'Committed',deal:'Proximity to Home',grade:'B-',required:'C+'}],notes:[]};
const key='franchise-hq-v1';let data;try{data=JSON.parse(localStorage.getItem(key))}catch(e){}if(!Array.isArray(data)||!data.length)data=[initial];for(const franchise of data){if(franchise.id==='washington-2029'&&Array.isArray(franchise.players)&&!franchise.players.some(p=>p.name==='Tate Reynolds'))franchise.players.push({name:'Tate Reynolds',pos:'QB',number:'8',year:'RS Junior',overall:82,dev:'Normal',deal:'Playing Time',grade:'A+',required:'C+',transferRisk:'Watch',hometown:'Queen Creek, Arizona',size:"6'2, 223 lb",notes:'High-floor backup quarterback. Transferred from Clemson after the 2026 season to Washington. Throw power 92, throw on the run 85, speed 87, agility 86, awareness 83.'})}for(const franchise of data){if(franchise.id==='washington-2029'){const t=franchise.players.find(p=>p.name==='Tate Reynolds');if(t){if(!t.dev)t.dev='Normal';if(!t.deal)t.deal='Playing Time';if(!t.grade)t.grade='A+';if(!t.required)t.required='C+';if(!t.transferRisk)t.transferRisk='Watch'}}}let selected=localStorage.getItem('franchise-hq-selected')||data[0].id;let tab='Dashboard';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const f=()=>data.find(x=>x.id===selected)||data[0];function save(){localStorage.setItem(key,JSON.stringify(data));localStorage.setItem('franchise-hq-selected',selected);document.getElementById('status').textContent='Saved on this device'}function chooseFranchise(id){selected=id;save();render()}function addFranchise(){const name=prompt('Franchise name?');if(!name)return;const sport=prompt('Sport / game?','Baseball')||'Sports';const season=prompt('Starting season?','2029')||'';const id='f'+Date.now();data.push({id,name,sport,season,colors:{primary:'#234b84',accent:'#d1d5db'},players:[],recruits:[],notes:[]});selected=id;save();render()}function changeTab(t){tab=t;render()}function applyTheme(){const x=f(),c=x.colors||(x.id==='washington-2029'?{primary:'#4b2e83',accent:'#b7a57a'}:{primary:'#234b84',accent:'#d1d5db'});document.documentElement.style.setProperty('--primary',c.primary);document.documentElement.style.setProperty('--accent',c.accent);document.documentElement.style.setProperty('--soft',c.primary==='#4b2e83'?'#f1ebf8':'#e8edf6')}function render(){applyTheme();document.getElementById('franchise').innerHTML=data.map(x=>'<option value="'+esc(x.id)+'" '+(x.id===selected?'selected':'')+'>'+esc(x.name)+' · '+esc(x.season)+'</option>').join('');document.getElementById('tabs').innerHTML=['Dashboard','Five-Year Outlook','Roster','Recruiting','War Room','Archive','Settings'].map(x=>'<button class="'+(x===tab?'active':'')+'" onclick="changeTab(\''+x+'\')">'+x+'</button>').join('');const x=f();document.getElementById('view').innerHTML=({Dashboard:dashboard,'Five-Year Outlook':outlook,Roster:roster,Recruiting:recruiting,'War Room':warroom,Archive:archive,Settings:settings})[tab](x)}
function dashboard(x){const elite=x.players.filter(p=>p.dev==='Elite').length;const nil=x.players.reduce((a,p)=>a+(+p.nil||0),0);return '<h2>'+esc(x.name)+' · '+esc(x.season)+'</h2><p class="muted">'+esc(x.sport)+' · Your sports universe headquarters</p><div class="grid">'+[['Roster profiles',x.players.length],['Elite development',elite],['Committed recruits',x.recruits.filter(r=>r.status==='Committed').length],['Known NIL points',nil]].map(([a,b])=>'<div class="card"><div class="stat">'+b+'</div><div class="muted">'+a+'</div></div>').join('')+'</div><div class="card"><h3>Front Office watchlist</h3>'+x.players.filter(p=>p.deal&&p.grade&&rank(p.grade)<rank(p.required)).map(p=>'<p>⚠ '+esc(p.name)+' — '+esc(p.deal)+' ('+esc(p.grade)+' / needs '+esc(p.required)+')</p>').join('')+'<p class="muted">Use Recruiting to manage commitments and the War Room for notes and AI context.</p></div>'}
function rank(s){return {'F':0,'D':1,'D+':2,'C-':3,'C':4,'C+':5,'B-':6,'B':7,'B+':8,'A-':9,'A':10,'A+':11}[s]??-1}
function playerCard(p,i,kind){return '<div class="card"><div class="row"><h3 class="wide">'+esc(p.name)+'</h3><button onclick="editItem(\''+kind+'\','+i+')">Edit</button><button onclick="removeItem(\''+kind+'\','+i+')">×</button></div><div><b>'+esc(p.pos||'')+'</b> '+(p.number!==undefined?'#'+esc(p.number):'')+' · '+esc(p.year||p.status||'')+' '+(p.overall!==undefined?' · '+esc(p.overall)+' OVR':'')+'</div><div>'+[p.dev,p.archetype,p.stars?p.stars+'★':'',p.rank?'#'+p.rank+' position':''].filter(Boolean).map(t=>'<span class="tag">'+esc(t)+'</span>').join('')+'</div><p class="muted">'+esc(p.size||'')+' · '+esc(p.hometown||'')+'</p>'+(p.nil!==undefined?'<p>NIL: '+esc(p.nil)+' points</p>':'')+(p.deal?'<p>Dealbreaker: '+esc(p.deal)+' · '+esc(p.grade||'?')+' / needs '+esc(p.required||'?')+(p.grade&&p.required?' <b class="'+(rank(p.grade)>=rank(p.required)?'good':'bad')+'">'+(rank(p.grade)>=rank(p.required)?'Satisfied':'At risk')+'</b>':'')+'</p>':'')+(p.notes?'<p>'+esc(p.notes)+'</p>':'')+'</div>'}

const outlookSlots=[['QB','QB'],['RB1','RB'],['RB2','RB'],['WR1','WR'],['WR2','WR'],['WR3','WR']];
function eligibility(p){const y=String(p.year||'').toLowerCase();let stage=y.includes('freshman')?0:y.includes('sophomore')?1:y.includes('junior')?2:y.includes('senior')?3:-1;return stage<0?null:stage}
function eligible(p,yr,base){const st=eligibility(p);return st===null||st+(yr-base)<=3}
function yearLabel(p,yr,base){const st=eligibility(p);if(st===null)return 'Class unknown';const n=st+yr-base;return (String(p.year).toLowerCase().includes('rs')?'RS ':'')+['FR','SO','JR','SR'][n]}
function outlookDefault(x,yr,slot){if(x.id!=='washington-2029')return '';const d={'QB':'George Breeze','RB1':'Caleb Scales','RB2':'Danny Waddy','WR1':'Clayton Silver','WR2':'Bobby Jennings'};const p=x.players.find(z=>z.name===d[slot]);return p&&eligible(p,yr,2029)?p.name:''}
function outlookPick(x,yr,slot,kind){const k=yr+'|'+slot+'|'+kind;return Object.prototype.hasOwnProperty.call(x.outlook||{},k)?x.outlook[k]:(kind==='starter'?outlookDefault(x,yr,slot):(x.id==='washington-2029'&&slot==='QB'&&(yr===2029||yr===2030)?'Tate Reynolds':''))}
function setOutlook(yr,slot,kind,val){const x=f();x.outlook=x.outlook||{};x.outlook[yr+'|'+slot+'|'+kind]=val;save();render()}
function outlookSelect(x,yr,slot,pos,kind,current){const base=Number(x.season)||2029;const available=x.players.filter(p=>p.pos===pos&&eligible(p,yr,base));const opts=['<option value="">'+(kind==='starter'?'Unassigned':'No backup')+'</option>'].concat(available.map(p=>'<option value="'+esc(p.name)+'" '+(p.name===current?'selected':'')+'>'+esc(p.name)+'</option>'));if(current&&!available.some(p=>p.name===current))opts.push('<option selected value="'+esc(current)+'">'+esc(current)+' (check eligibility)</option>');return '<select aria-label="'+kind+' '+slot+' '+yr+'" class="'+(kind==='backup'?'backup':'')+'" onchange="setOutlook('+yr+',\''+slot+'\',\''+kind+'\',this.value)">'+opts.join('')+'</select>'}
function toggleDepthEdit(id){const el=document.getElementById(id);if(!el)return;el.classList.toggle('open');if(el.classList.contains('open'))el.querySelector('select')?.focus()}
function depthEditor(x,yr,slot,pos,kind,current){const id='depth-'+yr+'-'+slot+'-'+kind;return '<div class="depth-edit" id="'+id+'">'+outlookSelect(x,yr,slot,pos,kind,current)+'</div>'}
function backupLine(x,yr,slot,pos,name,base){const p=x.players.find(z=>z.name===name);const rating=p?projectedOverall(p,yr,base):null;const id='depth-'+yr+'-'+slot+'-backup';return '<button type="button" class="backup-line" aria-label="Change backup for '+esc(slot)+' '+yr+'" onclick="toggleDepthEdit(\''+id+'\')"><span style="color:#75658d;font-size:10px">2</span><span class="backup-person"><span class="backup-name">'+esc(p?p.name:'Select backup')+'</span>'+(p?'<span class="backup-class">'+esc(yearLabel(p,yr,base))+'</span>':'')+'</span>'+(rating!==null?'<span class="backup-rating" style="background:'+ratingColor(rating,x)+'">'+esc(rating)+'</span>':'')+(p?'<span class="backup-dev" title="'+esc(p.dev||'Unknown development')+'" style="color:'+(String(p.dev||'').toLowerCase()==='elite'?'#9150cf':String(p.dev||'').toLowerCase()==='star'?'#b88715':'#64748b')+'">'+(String(p.dev||'').toLowerCase()==='elite'?'◆':String(p.dev||'').toLowerCase()==='star'?'★':String(p.dev||'').toLowerCase()==='impact'?'▲':'●')+'</span>':'')+(p&&p.transferRisk?'<span class="risk" title="Transfer watch">⚠</span>':'')+'</button>'+depthEditor(x,yr,slot,pos,'backup',name)}
function ratingColor(v,x){if(v===undefined||v===null||v==='')return '#64748b';const t=Object.assign({elite:90,great:80,solid:70,developing:60},x.ratingThresholds||{});return Number(v)>=t.elite?'#168454':Number(v)>=t.great?'#2798ad':Number(v)>=t.solid?'#d19a28':Number(v)>=t.developing?'#b96a36':'#b54d53'}
function devMark(d){const v=String(d||'').toLowerCase();return v==='elite'?'<span class="dev-mark"><span class="dev-icon" style="color:#dbb5ff">◆</span> Elite Dev</span>':v==='star'?'<span class="dev-mark"><span class="dev-icon" style="color:#e9c35a">★</span> Star Dev</span>':v==='normal'?'<span class="dev-mark"><span class="dev-icon" style="color:#d0d5df">●</span> Normal Dev</span>':'<span class="dev-mark">Dev unknown</span>'}
function projectedOverall(p,yr,base){if(p.overall===undefined||p.overall===null||p.overall==='')return null;const current=Number(p.overall),years=Math.max(0,yr-base);const rates={elite:5,star:4,impact:3,normal:2};const gain=rates[String(p.dev||'').toLowerCase()]||0;const limit=p.capOverall!==undefined&&p.capOverall!==''?Number(p.capOverall):(p.capped===true||String(p.capped).toLowerCase()==='yes'?current:99);return Math.min(99,limit,current+years*gain)}
function outlook(x){const base=Number(x.season)||2029;let html='<h2>Five-Year Outlook</h2><p class="muted">Projected offensive depth chart · '+base+'–'+(base+4)+'. Choose a starter and optional backup for each season. Projections are editable and do not change your actual roster.</p><div class="outlook-scroll"><div class="outlook-table"><div class="outlook-head">YEAR</div>'+outlookSlots.map(s=>'<div class="outlook-head">'+s[0]+'</div>').join('');
for(let yr=base;yr<base+5;yr++){html+='<div class="outlook-year">'+yr+'</div>';for(const [slot,pos] of outlookSlots){const name=outlookPick(x,yr,slot,'starter');const p=x.players.find(p=>p.name===name);const backup=outlookPick(x,yr,slot,'backup');const projected=p?projectedOverall(p,yr,base):null;html+='<div class="outlook-cell">'+(p?'<div class="mini-card">'+(projected!==null?'<span class="rating-bubble" style="background:'+ratingColor(projected,x)+'">'+esc(projected)+'</span>':'')+'<small>'+esc(slot)+' · '+esc(yearLabel(p,yr,base))+'</small><div class="mini-name">'+esc(p.name)+'</div><div>'+devMark(p.dev)+'</div><small>'+(yr===base?'Recorded OVR':'Last recorded OVR')+'</small></div>':'<div class="mini-card" style="opacity:.42"><small>'+esc(slot)+'</small><div class="mini-name">Open</div><small>Unassigned</small></div>')+'<button type="button" class="depth-change" onclick="toggleDepthEdit(\'depth-'+yr+'-'+slot+'-starter\')">Change starter ▾</button>'+depthEditor(x,yr,slot,pos,'starter',name)+backupLine(x,yr,slot,pos,backup,base)+'</div>'}}
return html+'</div></div><p class="outlook-note">Projected OVR: Elite +5, Star +4, Impact +3, Normal +2 per year, up to 99 or a player-specific cap. Projections are estimates, not recorded ratings. Eligibility is estimated from listed class years. Redshirts, transfers, early departures, and role changes can be adjusted manually. Initial RB and WR assignments are illustrative, not confirmed depth-chart decisions.</p>'}

function roster(x){return '<div class="row"><h2 class="wide">Roster · '+x.players.length+'</h2><button class="primary" onclick="editItem(\'players\',-1)">+ Player</button></div><input id="filter" placeholder="Search players or positions" oninput="filterCards()" style="width:100%;margin-bottom:12px"><div id="cards" class="grid">'+x.players.map((p,i)=>playerCard(p,i,'players')).join('')+'</div>'}
function filterCards(){const q=document.getElementById('filter').value.toLowerCase();document.querySelectorAll('#cards>.card').forEach(el=>el.style.display=el.textContent.toLowerCase().includes(q)?'':'none')}
function recruiting(x){return '<div class="row"><h2 class="wide">Recruiting board</h2><button class="primary" onclick="editItem(\'recruits\',-1)">+ Recruit</button></div><div class="grid">'+x.recruits.map((p,i)=>playerCard(p,i,'recruits')).join('')+'</div>'}
const fields=['name','pos','number','year','overall','dev','archetype','hometown','size','nil','stars','rank','status','deal','grade','required','capped','capOverall','transferRisk','notes'];function editItem(kind,i){const p=i<0?{}:f()[kind][i];document.getElementById('view').innerHTML='<h2>'+(i<0?'Add':'Edit')+' '+(kind==='players'?'player':'recruit')+'</h2><div class="card"><form id="editor" onsubmit="submitItem(event,\''+kind+'\','+i+')"><div class="grid">'+fields.map(k=>'<div><label>'+k.replace(/\b\w/g,c=>c.toUpperCase())+'</label>'+(k==='notes'?'<textarea name="'+k+'">'+esc(p[k]||'')+'</textarea>':'<input name="'+k+'" value="'+esc(p[k]??'')+'">')+'</div>').join('')+'</div><p><button class="primary">Save</button> <button type="button" onclick="render()">Cancel</button></p></form></div>'}
function submitItem(e,kind,i){e.preventDefault();const raw=Object.fromEntries(new FormData(e.target));const p={};Object.entries(raw).forEach(([k,v])=>{if(v.trim()!=='')p[k]=['overall','nil','stars','rank','capOverall'].includes(k)?Number(v):v});if(!p.name){alert('Name required');return}if(i<0)f()[kind].push(p);else f()[kind][i]=p;save();render()}
function removeItem(kind,i){if(!confirm('Delete this entry?'))return;f()[kind].splice(i,1);save();render()}
function warroom(x){return '<h2>The War Room</h2><div class="card"><p>Record scouting, storylines, trade ideas, and season notes.</p><textarea id="newnote" placeholder="What happened? What should your front office remember?"></textarea><p><button class="primary" onclick="addNote()">Save note</button> <button onclick="copyContext()">Copy AI context</button></p><p class="muted">Copy AI context and paste into ChatGPT to discuss this franchise. Live AI chat is not yet connected.</p></div>'+x.notes.slice().reverse().map(n=>'<div class="card"><small class="muted">'+esc(n.date)+'</small><p>'+esc(n.text)+'</p></div>').join('')}
function addNote(){const t=document.getElementById('newnote').value.trim();if(!t)return;f().notes.push({date:new Date().toLocaleDateString(),text:t});save();render()}
function context(){const x=f();return 'Franchise HQ — '+x.name+' ('+x.sport+', '+x.season+')\nROSTER\n'+x.players.map(p=>JSON.stringify(p)).join('\n')+'\nRECRUITING\n'+x.recruits.map(p=>JSON.stringify(p)).join('\n')+'\nNOTES\n'+x.notes.map(n=>n.date+': '+n.text).join('\n')}
function copyContext(){navigator.clipboard.writeText(context()).then(()=>alert('Copied franchise context')).catch(()=>{const t=document.createElement('textarea');t.value=context();document.body.append(t);t.select();document.execCommand('copy');t.remove();alert('Copied')})}
function archive(x){return '<h2>The Archive</h2><div class="card"><h3>'+esc(x.name)+' · '+esc(x.season)+'</h3><p>'+x.players.length+' roster profiles · '+x.recruits.length+' recruiting records · '+x.notes.length+' notes</p><p class="muted">This is the foundation for season-by-season history, career records, and player biographies.</p></div>'}
function setRating(k,v){const x=f();x.ratingThresholds=x.ratingThresholds||{};x.ratingThresholds[k]=Number(v);save();render()}function setColor(k,v){if(!/^#[0-9a-f]{6}$/i.test(v))return;f().colors=f().colors||{};f().colors[k]=v;save();render()}function settings(x){const c=x.colors||(x.id==='washington-2029'?{primary:'#4b2e83',accent:'#b7a57a'}:{primary:'#234b84',accent:'#d1d5db'});return '<h2>Settings & backups</h2><div class="card"><h3>OVR color thresholds</h3><p class="muted">Adjust ratings for this franchise. Higher ratings take precedence.</p><div class="rating-settings">'+[['elite',90],['great',80],['solid',70],['developing',60]].map(([k,d])=>'<label>'+k.toUpperCase()+' starts at<input type="number" min="0" max="99" value="'+esc((x.ratingThresholds||{})[k]??d)+'" onchange="setRating(\''+k+'\',this.value)"></label>').join('')+'</div></div><div class="card"><h3>Franchise colors</h3><div class="row"><label>Primary <input type="color" value="'+esc(c.primary)+'" onchange="setColor(\'primary\',this.value)"></label><label>Accent <input type="color" value="'+esc(c.accent)+'" onchange="setColor(\'accent\',this.value)"></label></div><p class="muted">Colors follow the selected franchise.</p></div><div class="card"><p><b>Storage:</b> This browser only. Changes do not sync between devices yet.</p><button class="primary" onclick="backup()">Export all franchises</button> <label>Import backup JSON</label><input type="file" accept=".json,application/json" onchange="restore(event)"><p class="muted">Import replaces all local franchises. Export a backup first.</p></div>'}
function backup(){const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='franchise-hq-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
async function restore(e){try{const x=JSON.parse(await e.target.files[0].text());if(!Array.isArray(x)||!x.every(z=>z.id&&z.name&&Array.isArray(z.players)))throw Error('Invalid backup');if(!confirm('Replace all local franchises with this backup?'))return;data=x;selected=data[0].id;save();render()}catch(err){alert(err.message)}}
save();render();
</script></html>
