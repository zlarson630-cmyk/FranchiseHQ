function devMark(d){const v=String(d||'').toLowerCase();return v==='elite'?'<span class="dev-mark"><span class="dev-icon" style="color:#dbb5ff">◆</span> Elite Dev</span>':v==='star'?'<span class="dev-mark"><span class="dev-icon" style="color:#e9c35a">★</span> Star Dev</span>':v==='normal'?'<span class="dev-mark"><span class="dev-icon" style="color:#d0d5df">●</span> Normal Dev</span>':'<span class="dev-mark">Dev unknown</span>'}
function projectedOverall(p,yr,base){if(p.overall===undefined||p.overall===null||p.overall==='')return null;const current=Number(p.overall),years=Math.max(0,yr-base);const rates={elite:5,star:4,impact:3,normal:2};const gain=rates[String(p.dev||'').toLowerCase()]||0;const limit=p.capOverall!==undefined&&p.capOverall!==''?Number(p.capOverall):(p.capped===true||String(p.capped).toLowerCase()==='yes'?current:99);return Math.min(99,limit,current+years*gain)}
function outlook(x){if(/basketball/i.test(x.sport||''))return '<h2>Five-Year Outlook · Basketball</h2><p class="muted">Basketball rotation and scholarship planning will be configured after the starting season and roster are established. Football positions are intentionally hidden.</p>';const base=Number(x.season)||2029;let html='<h2>Five-Year Outlook</h2><p class="muted">Projected team depth chart · '+base+'–'+(base+4)+'. Positions down the left, years across the top. Choose a starter and optional backup for each season.</p><div class="outlook-scroll"><div class="outlook-table"><div class="outlook-head">POSITION</div>'+Array.from({length:5},(_,i)=>'<div class="outlook-head">'+(base+i)+'</div>').join('');for(const [slot,pos] of outlookSlots){html+='<div class="outlook-year">'+esc(slot)+'</div>';for(let yr=base;yr<base+5;yr++){const name=outlookPick(x,yr,slot,'starter');const p=outlookCandidates(x,yr,base).find(p=>p.name===name);const backup=outlookPick(x,yr,slot,'backup');const projected=p?projectedOverall(p,yr,p.incomingRecruit?base+1:base):null;html+='<div class="outlook-cell">'+(p?'<div class="mini-card">'+(projected!==null?'<span class="rating-bubble" style="background:'+ratingColor(projected,x)+'">'+esc(projected)+'</span>':'')+'<small>'+esc(slot)+' · '+esc(p.incomingRecruit?'Committed recruit · '+['FR','SO','JR','SR'][Math.min(3,yr-base-1)]:yearLabel(p,yr,base))+'</small><div class="mini-name">'+esc(p.name)+'</div><div>'+devMark(p.dev)+'</div>'+(redshirtAdvice(p,yr,base)?'<small class="tag" title="Advisory only; eligibility unchanged">'+esc(redshirtAdvice(p,yr,base))+'</small>':'')+'<small>'+(yr===base?'Recorded OVR':'Projected OVR')+'</small></div>':'<div class="mini-card" style="opacity:.42"><small>'+esc(slot)+'</small><div class="mini-name">Open</div><small>Unassigned</small></div>')+'<button type="button" class="depth-change" onclick="toggleDepthEdit(\'depth-'+yr+'-'+slot+'-starter\')">Change starter ▾</button>'+depthEditor(x,yr,slot,pos,'starter',name)+backupLine(x,yr,slot,pos,backup,base)+'</div>'}}return html+'</div></div><p class="outlook-note">Projected OVR: Elite +5, Star +4, Impact +3, Normal +2 per year, up to 99 or a player-specific cap. Projections are estimates, not recorded ratings. Eligibility is estimated from listed class years. Redshirts, transfers, early departures, and role changes can be adjusted manually. Initial assignments are illustrative, not confirmed depth-chart decisions. Hard-committed recruits appear as incoming prospects starting in 2030; they are not yet on the active roster and have no invented overall ratings.</p>'}

function rosterSnapshot(x){const base=Number(x.season)||2029;const order=['QB','RB','FB','WR','TE','LT','LG','C','RG','RT','OL','EDGE','DT','DL','LB','CB','FS','SS','S','K','P'];const players=x.players.map((p,i)=>({p,i})).sort((a,b)=>{const pa=order.indexOf(a.p.pos),pb=order.indexOf(b.p.pos);return (pa<0?99:pa)-(pb<0?99:pb)||a.p.name.localeCompare(b.p.name)});let html='<div class="row"><h2 class="wide">Roster Snapshot</h2><button onclick="changeTab(\'Five-Year Outlook\')">Detailed outlook</button></div><p class="muted">Players down the left, seasons across the top. Tap a name or rating to open the player profile.</p><div class="snapshot-scroll"><div class="snapshot-grid"><div class="snapshot-head snapshot-player-head">PLAYER</div>'+Array.from({length:5},(_,i)=>'<div class="snapshot-head">'+(base+i)+'</div>').join('');let last='';for(const {p,i} of players){const pos=p.pos||'OTHER';if(pos!==last){html+='<div class="snapshot-group">'+esc(pos)+'</div>';last=pos}html+='<button class="snapshot-player" onclick="openPlayer('+i+')"><span class="snapshot-player-name">'+esc(p.name)+'</span><small>'+esc(pos)+(p.number?' · #'+esc(p.number):'')+'</small></button>';for(let j=0;j<5;j++){const yr=base+j,active=eligible(p,yr,base),o=active?projectedOverall(p,yr,base):null;html+='<div class="snapshot-rating-cell">'+(active?'<button class="snapshot-rating" onclick="openPlayer('+i+')" title="'+esc(p.name+' · '+yr)+'" style="background:'+(o===null?'#707783':ratingColor(o,x))+'">'+(o===null?'—':o)+'<span class="snapshot-trait">'+(String(p.dev||'').toLowerCase()==='elite'?'◆':String(p.dev||'').toLowerCase()==='star'?'★':String(p.dev||'').toLowerCase()==='impact'?'▲':String(p.dev||'').toLowerCase()==='normal'?'●':'')+'</span></button>':'<span class="snapshot-empty">—</span>')+'</div>'}}return html+'</div></div><p class="muted">◆ Elite · ★ Star · ▲ Impact · ● Normal. Ratings after the current season are projections. A dash means the player is past estimated eligibility; unknown ratings show —.</p>'}
function openPlayer(i){const x=f(),p=x.players[i];if(!p)return;history.replaceState(null,'',location.pathname+location.search+'#player='+encodeURIComponent(p.name));document.getElementById('view').innerHTML=playerProfile(p,i,x)}
function profileField(label,value){return '<div class="profile-field"><small>'+esc(label)+'</small><strong>'+esc(value===undefined||value===null||value===''?'Not recorded':value)+'</strong></div>'}
function profileSection(title,body){return '<section class="card profile-section"><h3>'+title+'</h3>'+body+'</section>'}
function playerProfile(p,i,x){const base=Number(x.season)||2029;const isGeorge=p.name==='George Breeze'&&x.id==='washington-2029';const recruiting=p.recruiting||{};const historyItems=p.history||[];const stats=p.stats||[];const badges=p.badges||[];const attrs=p.attributes||{};const details=isGeorge?{...{'Throw Power':96,'Deep Accuracy':90,'Speed':90,'Break Sack':83,'Agility':85,'Throw on Run':82},...attrs}:attrs;const star=recruiting.stars??(isGeorge?5:p.stars);const intro='<div class="profile-hero"><div><span class="profile-kicker">'+esc(x.name)+' / '+esc(x.season)+'</span><h2>'+esc(p.name)+'</h2><p>'+esc(p.pos||'Player')+(p.number?' · #'+esc(p.number):'')+' · '+esc(p.year||'Class unknown')+'</p><p>'+esc(p.hometown||'Hometown not recorded')+'</p></div><div class="profile-big-ovr" style="background:'+ratingColor(p.overall,x)+'">'+esc(p.overall??'—')+'<small>OVR</small></div></div>';let h='<div class="row"><button onclick="closePlayer()">← Back</button><span class="wide"></span><button onclick="copyPlayerLink()">Copy link</button><button onclick="editItem(\'players\','+i+')">Edit</button></div>'+intro+'<div class="profile-grid">'+profileField('Development',p.dev)+profileField('Height / weight',p.size)+profileField('Archetype',p.archetype)+profileField('NIL points',p.nil)+profileField('Transfer watch',p.transferRisk||'Not flagged')+'</div>';
h+=profileSection('Player attributes','<div class="profile-grid">'+Object.entries(details).map(([k,v])=>profileField(k,v)).join('')+(Object.keys(details).length?'':'<p class="muted">No attributes uploaded yet.</p>')+'</div>');
h+=profileSection('Recruiting history','<div class="profile-grid">'+profileField('Recruit rating',star?star+' stars':'Not recorded')+profileField('High school / origin',recruiting.highSchool||p.hometown)+profileField('Recruiting class',recruiting.classYear)+profileField('National rank',recruiting.nationalRank)+profileField('Position rank',recruiting.positionRank)+profileField('Recruiting coach',recruiting.coach)+profileField('Commitment',recruiting.commitment)+'</div>');
h+=profileSection('Transfers & career timeline',historyItems.length?historyItems.map(z=>'<div class="profile-event"><b>'+esc(z.season||z.date||'Date unknown')+'</b> · '+esc(z.type||'Event')+' — '+esc(z.description||'')+'</div>').join(''):'<p class="muted">No transfers or career events recorded. That does not confirm a player has never transferred.</p>');
h+=profileSection('Season statistics',stats.length?'<div class="profile-grid">'+stats.map(z=>profileField(z.label||z.season||'Stat',z.value)).join('')+'</div>':'<p class="muted">Season stats not uploaded yet.</p>');
h+=profileSection('Badges & honors',badges.length?badges.map(z=>'<span class="tag">'+esc(typeof z==='string'?z:z.name||'Badge')+'</span>').join(''):'<p class="muted">Badges and honors can be added later.</p>');
h+=profileSection('Scouting notes','<p>'+esc(p.notes||'No notes yet.')+'</p>'+(p.deal?'<p>Dealbreaker: '+esc(p.deal)+'</p>':''));
h+='<p class="muted">Profiles use your locally saved franchise data. The link can open this player on your device, but uploaded edits are not publicly synchronized yet.</p>';return h}
function closePlayer(){history.replaceState(null,'',location.pathname+location.search);render()}
function copyPlayerLink(){navigator.clipboard.writeText(location.href).then(()=>alert('Link copied. Public sharing of custom data requires cloud publishing.')).catch(()=>alert('Unable to copy link.'))}


function coachingStaff(x){const staff=x.staff||[];return '<div class="row"><h2 class="wide">Coaching Staff · '+esc(x.season)+'</h2><button class="primary" onclick="editCoach(-1)">+ Coach</button></div><p class="muted">Build your coaching tree across seasons. Staff profiles can track recruiting connections, career moves and franchise storylines.</p><div class="grid">'+staff.map((c,i)=>'<div class="card coach-card"><div class="row"><div class="wide"><small class="coach-label">'+esc(c.role||'Coach')+'</small><h3>'+esc(c.name)+'</h3></div><button onclick="editCoach('+i+')">Edit</button></div><div class="coach-meta"><span class="coach-prestige">'+esc(c.prestige||'—')+' <small>Prestige</small></span><span class="coach-level">LVL '+esc(c.level??'—')+'</span></div><div class="profile-grid">'+profileField('Archetype',c.archetype)+profileField('Alma mater',c.almaMater)+profileField('Offense',c.offense)+profileField('Defense',c.defense)+'</div>'+(c.mainCharacter?'<p><span class="tag">★ Main character</span></p>':'')+(c.notes?'<p>'+esc(c.notes)+'</p>':'')+'<p class="muted">'+(c.history?.length?esc(c.history.length)+' career timeline entries · '+esc(c.history[0].years)+'–'+esc(c.history[c.history.length-1].years):'Career timeline not entered')+'</p><button class="primary" onclick="openCoach('+i+')">View full career timeline →</button></div>').join('')+'</div>'}
function coachIndex(x){const all=[...(x.staff||[]).map((c,i)=>({c,i,archive:false})),...(x.coachIndex||[]).map((c,i)=>({c,i,archive:true}))];return '<div class="row"><h2 class="wide">Coach Index</h2><button onclick="changeTab(\'Coaching Staff\')">Current staff</button></div><p class="muted">Permanent coaching profiles across your dynasty, including coaches who never worked at Washington.</p><div class="grid">'+all.map(({c,i,archive})=>'<div class="card coach-card"><small class="coach-label">'+esc(archive?'Historical coach':'Washington staff')+'</small><h3>'+esc(c.name)+'</h3><p>'+esc(c.role||'Coach')+' · '+esc(c.team||(archive?'':'Washington'))+'</p><button class="primary" onclick="openCoach('+i+','+archive+')">View profile</button></div>').join('')+'</div>'}
function openCoach(i,archive=false){const x=f(),c=archive?(x.coachIndex||[])[i]:(x.staff||[])[i];if(!c)return;const history=c.history||[];const recruits=x.players.filter(p=>p.recruiting&&p.recruiting.coach===c.name);const peers=[];history.forEach(h=>{if(h.headCoach)peers.push({label:'Head Coach',name:h.headCoach,years:h.years,team:h.team});if(h.offensiveCoordinator)peers.push({label:'Offensive Coordinator',name:h.offensiveCoordinator,years:h.years,team:h.team})});const all=[...(x.staff||[]).map((c,i)=>({c,i,archive:false})),...(x.coachIndex||[]).map((c,i)=>({c,i,archive:true}))];const connections=peers.map(peer=>{const match=all.find(z=>z.c.name===peer.name);return '<div class="profile-event"><b>'+esc(peer.years)+' · '+esc(peer.team)+'</b><p>'+esc(peer.label)+': '+(match?'<button class="profile-link" onclick="openCoach('+match.i+','+match.archive+')">'+esc(peer.name)+'</button>':esc(peer.name))+'</p></div>'}).join('');document.getElementById('view').innerHTML='<div class="row"><button onclick="changeTab(\'Coach Index\')">← Coach Index</button><span class="wide"></span>'+(!archive?'<button onclick="editCoach('+i+')">Edit</button>':'')+'</div><div class="profile-hero"><div><span class="profile-kicker">'+esc(c.role||'Coach')+' · '+esc(c.team||'Washington')+'</span><h2>'+esc(c.name)+'</h2><p>'+esc(c.archetype||'')+' · '+esc(c.almaMater||'')+'</p></div><div class="coach-profile-prestige">'+esc(c.prestige||'—')+'<small>Prestige</small></div></div><div class="profile-grid">'+profileField('Level',c.level)+profileField('Offensive scheme',c.offense)+profileField('Defensive scheme',c.defense)+profileField('Alma mater',c.almaMater)+'</div>'+profileSection('Biography',c.biography?'<p>'+esc(c.biography)+'</p>':'No biography recorded')+profileSection('Coaching career & history',history.length?history.map(h=>'<div class="profile-event"><b>'+esc(h.years||'Year unknown')+'</b> · '+esc(h.team||'')+' · '+esc(h.role||'')+(h.record?'<p>Overall '+esc(h.record)+' · Conference '+esc(h.conferenceRecord||'—')+'</p>':'')+(h.conferenceTitle?'<p>'+esc(h.conferenceTitle)+'</p>':'')+(h.postseason?'<p>'+esc(h.postseason)+'</p>':'')+'</div>').join(''):'<p class="muted">Career timeline not entered yet.</p>')+profileSection('Coaching tree & connections',connections||'<p class="muted">No coaching connections recorded yet.</p>')+profileSection('Recruiting connections',recruits.length?recruits.map(p=>'<p><button class="profile-link" onclick="openPlayer('+x.players.indexOf(p)+')">'+esc(p.name)+'</button></p>').join(''):'<p class="muted">No linked recruits yet.</p>')+profileSection('Dynasty notes','<p>'+esc(c.notes||'No notes yet.')+'</p>')}
function editCoach(i){const c=i<0?{}:f().staff[i];const fields=[['name','Name'],['role','Staff role'],['season','Season'],['prestige','Prestige'],['almaMater','Alma mater'],['level','Level'],['archetype','Archetype'],['offense','Offensive scheme'],['defense','Defensive scheme'],['notes','Notes']];document.getElementById('view').innerHTML='<h2>'+(i<0?'Add coach':'Edit '+esc(c.name))+'</h2><form class="card" onsubmit="saveCoach(event,'+i+')"><div class="grid">'+fields.map(([key,label])=>'<label>'+label+'<input name="'+key+'" value="'+esc(c[key]??'')+'"></label>').join('')+'</div><p><label><input type="checkbox" name="mainCharacter" '+(c.mainCharacter?'checked':'')+'> Main character</label></p><button class="primary">Save coach</button> <button type="button" onclick="render()">Cancel</button></form>'}
function saveCoach(e,i){e.preventDefault();const values=Object.fromEntries(new FormData(e.target));if(!String(values.name||'').trim()){alert('Name required');return}const old=i<0?{}:f().staff[i];const coach={...old,...values,level:values.level===''?undefined:Number(values.level),mainCharacter:!!values.mainCharacter};if(i<0){coach.id='coach-'+Date.now();f().staff.push(coach)}else f().staff[i]=coach;save();tab='Coaching Staff';render()}

function roster(x){return '<div class="row"><h2 class="wide">Roster · '+x.players.length+'</h2><button class="primary" onclick="editItem(\'players\',-1)">+ Player</button></div><input id="filter" placeholder="Search players or positions" oninput="filterCards()" style="width:100%;margin-bottom:12px"><div id="cards" class="grid">'+x.players.map((p,i)=>playerCard(p,i,'players')).join('')+'</div>'}
function filterCards(){const q=document.getElementById('filter').value.toLowerCase();document.querySelectorAll('#cards>.card').forEach(el=>el.style.display=el.textContent.toLowerCase().includes(q)?'':'none')}
function recruiting(x){return '<div class="row"><h2 class="wide">Recruiting board</h2><button class="primary" onclick="editItem(\'recruits\',-1)">+ Recruit</button></div><div class="grid">'+x.recruits.map((p,i)=>playerCard(p,i,'recruits')).join('')+'</div>'}
const fields=['name','pos','number','year','overall','dev','archetype','hometown','size','nil','stars','rank','nationalRank','gem','speed','breakTackle','catching','changeOfDirection','zoneCoverage','tackle','status','deal','grade','required','capped','capOverall','transferRisk','notes'];function editItem(kind,i){const p=i<0?{}:f()[kind][i];document.getElementById('view').innerHTML='<h2>'+(i<0?'Add':'Edit')+' '+(kind==='players'?'player':'recruit')+'</h2><div class="card"><form id="editor" onsubmit="submitItem(event,\''+kind+'\','+i+')"><div class="grid">'+fields.map(k=>'<div><label>'+k.replace(/\b\w/g,c=>c.toUpperCase())+'</label>'+(k==='notes'?'<textarea name="'+k+'">'+esc(p[k]||'')+'</textarea>':'<input name="'+k+'" value="'+esc(p[k]??'')+'">')+'</div>').join('')+'</div><p><button class="primary">Save</button> <button type="button" onclick="render()">Cancel</button></p></form></div>'}
function submitItem(e,kind,i){e.preventDefault();const raw=Object.fromEntries(new FormData(e.target));const p={};Object.entries(raw).forEach(([k,v])=>{if(v.trim()!=='')p[k]=['overall','nil','stars','rank','nationalRank','speed','breakTackle','catching','changeOfDirection','zoneCoverage','tackle','capOverall'].includes(k)?Number(v):v});if(!p.name){alert('Name required');return}if(kind==='recruits')p.gem=['true','yes','1','gem','green'].includes(String(p.gem||'').toLowerCase());if(i<0)f()[kind].push(p);else f()[kind][i]={...f()[kind][i],...p};save();render()}
function removeItem(kind,i){if(!confirm('Delete this entry?'))return;f()[kind].splice(i,1);save();render()}
function warroom(x){return '<h2>The War Room</h2><div class="card"><p>Record scouting, storylines, trade ideas, and season notes.</p><textarea id="newnote" placeholder="What happened? What should your front office remember?"></textarea><p><button class="primary" onclick="addNote()">Save note</button> <button onclick="copyContext()">Copy AI context</button></p><p class="muted">Copy AI context and paste into ChatGPT to discuss this franchise. Live AI chat is not yet connected.</p></div>'+x.notes.slice().reverse().map(n=>'<div class="card"><small class="muted">'+esc(n.date)+'</small><p>'+esc(n.text)+'</p></div>').join('')}
function addNote(){const t=document.getElementById('newnote').value.trim();if(!t)return;f().notes.push({date:new Date().toLocaleDateString(),text:t});save();render()}
function context(){const x=f();return 'Franchise HQ — '+x.name+' ('+x.sport+', '+x.season+')\nROSTER\n'+x.players.map(p=>JSON.stringify(p)).join('\n')+'\nRECRUITING\n'+x.recruits.map(p=>JSON.stringify(p)).join('\n')+'\nNOTES\n'+x.notes.map(n=>n.date+': '+n.text).join('\n')}
function copyContext(){navigator.clipboard.writeText(context()).then(()=>alert('Copied franchise context')).catch(()=>{const t=document.createElement('textarea');t.value=context();document.body.append(t);t.select();document.execCommand('copy');t.remove();alert('Copied')})}

function illinoisLegacy(x){const d=window.ILLINOIS_LEGACY;if(!d)return '<h2>Illinois Legacy</h2><p>Archive is loading. Refresh this page.</p>';const active=Number(x.legacyTab||0);const tabs=d.tabs;const t=tabs[Math.max(0,Math.min(active,tabs.length-1))];const sections=[['Overview',0],['2011–12',1],['2010–11',5],['Recruiting',10],['Characters',11],['Big Ten',17]];return '<h2>Illinois Legacy · College Hoops 2K8</h2><p class="muted">Original archive from your Google Doc. NCAA opener vs Baylor is pending. <a href="'+d.source+'" target="_blank" rel="noopener">Source document</a></p><div class="row">'+sections.map(([name,i])=>'<button '+(active===i?'class="active" ':'')+'onclick="setIllinoisTab('+i+')">'+name+'</button>').join('')+'</div><div class="card"><label for="legacySection">Archive page</label><select id="legacySection" onchange="setIllinoisTab(Number(this.value))" style="width:100%">'+tabs.map((p,i)=>'<option value="'+i+'" '+(i===active?'selected':'')+'>'+esc(p.title)+'</option>').join('')+'</select></div><div class="card legacy-article"><h2>'+esc(t.title)+'</h2>'+t.blocks.map((b,i)=>'<p class="'+(i===0?'legacy-lead':'')+'">'+esc(b)+'</p>').join('')+'</div>'}
function setIllinoisTab(i){f().legacyTab=i;save();render()}

function scribeArticles(x){return Array.isArray(x.scribeArticles)?x.scribeArticles:[]}

function mediaPublications(x){if(!Array.isArray(x.publications))x.publications=[];for(const p of [{id:'firebird',name:'Firebird',voice:'Fast-moving, personality-driven coverage of the franchise universe.',brand:'Digital-first sports feed',description:'News, reactions and ongoing storylines.'},{id:'saturday-scribe',name:'Saturday Scribe',voice:'Thoughtful, narrative-driven long-form sports journalism.',brand:'Classic sports newspaper',description:'Features, game stories and historical reporting.'}])if(!x.publications.some(z=>z.id===p.id))x.publications.push({...p});return x.publications}
function mediaWriters(x){if(!Array.isArray(x.mediaPersonalities))x.mediaPersonalities=[];return x.mediaPersonalities}
function mediaStoryList(x,pub){return scribeArticles(x).filter(a=>!pub||((a.publicationId||'saturday-scribe')===pub)).slice().sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')))}
function mediaWriterName(x,id){return mediaWriters(x).find(w=>w.id===id)?.name||'Unassigned writer'}

function storyArt(a,large){const label=esc((a.category||'COLLEGE FOOTBALL').toUpperCase());const color=(a.category==='Coaching'?'#243b59':a.category==='Recruiting'?'#6a342d':'#304b45');return '<div style="background:linear-gradient(135deg,'+color+',#151d2e);color:#fff;min-height:'+(large?'250':'140')+'px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:18px;text-align:center"><div style="font-family:Georgia,serif;font-weight:900;letter-spacing:.11em;font-size:'+(large?'30':'20')+'px">SATURDAY<br>SCRIBE</div><small style="letter-spacing:.15em;opacity:.8">'+label+'</small></div>'}
function storyClick(franchiseId,id,back){return 'onclick="openScribeStory('+JSON.stringify(franchiseId).replace(/"/g,'&quot;')+','+JSON.stringify(id).replace(/"/g,'&quot;')+','+JSON.stringify(back||'Saturday Scribe').replace(/"/g,'&quot;')+')"'}
function mediaStoryCards(x,pub){const stories=mediaStoryList(x,pub);return stories.length?'<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px">'+stories.map(a=>'<article class="card" style="padding:0;overflow:hidden;cursor:pointer" '+storyClick(x.id,a.id,'Publications')+'>'+storyArt(a,false)+'<div style="padding:16px"><small class="muted">'+esc(a.category||'Feature')+' · '+esc(a.date||'')+'</small><h3>'+esc(a.headline||'Untitled')+'</h3><p>'+esc(a.deck||'')+'</p><small class="muted">By '+esc(mediaWriterName(x,a.writerId))+'</small></div></article>').join('')+'</div>':'<div class="card"><p>No stories published yet.</p></div>'}

function saturdayScribe(x){const stories=mediaStoryList(x,'saturday-scribe');const lead=stories[0],rest=stories.slice(1);return '<header style="padding:24px 0;border-bottom:4px solid #1e293b;text-align:center"><small style="letter-spacing:.2em">THE HOME OF COLLEGE FOOTBALL</small><h1 style="font-family:Georgia,serif;font-size:clamp(35px,8vw,64px);letter-spacing:-.05em;margin:8px 0">SATURDAY SCRIBE</h1><small>NEWS · ANALYSIS · RECRUITING · THE COACHING CAROUSEL</small></header><div class="row" style="margin:20px 0"><h2 class="wide">Top Stories</h2><button class="primary" onclick="scribeEditById(null,\'saturday-scribe\')">+ Write a story</button></div>'+(lead?'<article class="card" style="padding:0;overflow:hidden;cursor:pointer" '+storyClick(x.id,lead.id)+'>'+storyArt(lead,true)+'<div style="padding:20px"><small class="muted">TOP STORY · '+esc(lead.category||'Feature')+' · '+esc(lead.date||'')+'</small><h2 style="font-family:Georgia,serif;font-size:clamp(25px,5vw,38px);line-height:1.14;margin:12px 0">'+esc(lead.headline)+'</h2><p>'+esc(lead.deck||'')+'</p><small class="muted">By '+esc(mediaWriterName(x,lead.writerId))+' · Read story →</small></div></article>':'<div class="card">No stories yet. Publish the first Saturday Scribe feature.</div>')+(rest.length?'<h2 style="margin-top:26px">More Headlines</h2><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px">'+rest.map(a=>'<article class="card" style="padding:0;overflow:hidden;cursor:pointer" '+storyClick(x.id,a.id)+'>'+storyArt(a,false)+'<div style="padding:16px"><small class="muted">'+esc(a.category||'News')+' · '+esc(a.date||'')+'</small><h3>'+esc(a.headline)+'</h3><p>'+esc(a.deck||'')+'</p><small>Read story →</small></div></article>').join('')+'</div>':'')}

).join('')+'</div>':'<p class="muted">More stories will appear here as this publication grows.</p>')+'</article>'}
function firebird(x){
const entries=data.flatMap(fr=>{
 const articles=scribeArticles(fr).map(a=>({kind:'article',...a,franchiseName:fr.name,franchiseId:fr.id}));

 const owner=data.find(fr=>fr.id===a.franchiseId)||x;

 const linkedStory=isArticle?a:(isPost&&a.writerId?scribeArticles(owner).find(st=>st.writerId===a.writerId&&st.id==='scribe-2027-bjornson-washington'):null);
 const link=linkedStory?'<button style="display:block;width:100%;text-align:left;margin-top:12px;padding:12px;border:1px solid #d4d4d8;border-radius:10px;background:var(--soft);color:inherit" onclick="openFirebirdStory('+JSON.stringify(a.franchiseId).replace(/"/g,'&quot;')+','+JSON.stringify(linkedStory.id).replace(/"/g,'&quot;')+')"><small class="muted">SATURDAY SCRIBE · ARTICLE</small><strong style="display:block;margin-top:5px">'+esc(linkedStory.headline)+'</strong><small>Read full story →</small></button>':'';
 return '<article class="card" style="padding:16px;border-radius:14px"><small class="muted"><strong>'+esc(handle)+'</strong> · '+esc(a.date||'')+' · '+esc(a.franchiseName)+'</small><p style="white-space:pre-wrap;line-height:1.5;margin:10px 0">'+esc(intro)+'</p>'+link+'</article>';

return '<div class="card" style="background:linear-gradient(125deg,#5e1b16,#b44420);color:white;padding:22px"><small>FRANCHISE HQ SOCIAL</small><h1 style="font-family:Georgia,serif;font-size:clamp(34px,7vw,58px);margin:5px 0">FIREBIRD</h1><p>Every voice. Every headline. One sports universe.</p></div><div class="row"><h2 class="wide">The feed</h2><button class="primary" onclick="nationalHeadlineEdit()">+ National headline</button></div><p class="muted">Short posts and linked stories from your fictional sports universe.</p>'+(cards?'<div style="display:grid;gap:10px;max-width:740px">'+cards+'</div>':'<div class="card">The feed is quiet.</div>');
}

function archive(x){if(x.id==='illinois-basketball-2010')return illinoisLegacy(x);const legends=x.historicalPlayers||[];const events=(x.universeHistory||[]).slice().sort((a,b)=>String(a.year||'').localeCompare(String(b.year||'')));const rules=x.universeRules||[];const foundation='<h3>Universe Foundation</h3><div class="grid">'+events.map(h=>'<div class="card"><small class="muted">'+esc(h.year||'')+' · '+esc(h.type||'History')+'</small><h3>'+esc(h.title||'')+'</h3><p>'+esc(h.body||'')+'</p></div>').join('')+'</div><h3>Established Universe Rules</h3><div class="grid">'+rules.map(z=>'<div class="card"><h3>'+esc(z.title||z.name||'Rule')+'</h3><p>'+esc(z.body||z.description||'')+'</p></div>').join('')+'</div>';return '<h2>The Archive</h2><div class="card"><h3>'+esc(x.name)+' · '+esc(x.season)+'</h3><p>'+x.players.length+' current roster profiles · '+legends.length+' historical players · '+x.recruits.length+' recruiting records · '+x.notes.length+' notes</p></div><h3>Historical Players & Awards</h3><div class="grid">'+(legends.length?legends.map((p,i)=>'<div class="card"><small class="coach-label">'+esc(p.season)+' · '+esc(p.team)+'</small><h3>'+esc(p.name)+'</h3><p>'+esc(p.role||p.position||'')+'</p>'+((p.awards||[]).map(a=>'<span class="tag">🏆 '+esc(a.name)+'</span>').join(''))+'<p class="muted">'+esc(p.notes||'')+'</p><button onclick="openHistoricalPlayer('+i+')">View historical profile</button></div>').join(''):'<p class="muted">No historical players recorded yet.</p>')+'</div>'}function openHistoricalPlayer(i){const p=(f().historicalPlayers||[])[i];if(!p)return;document.getElementById('view').innerHTML='<button onclick="changeTab(\'Archive\')">← Archive</button><div class="profile-hero"><div><span class="profile-kicker">'+esc(p.team)+' · '+esc(p.season)+'</span><h2>'+esc(p.name)+'</h2><p>'+esc(p.role||p.position||'')+'</p></div></div>'+profileSection('Awards',(p.awards||[]).map(a=>'<p>🏆 '+esc(a.season)+' '+esc(a.name)+' — '+esc(a.description||'')+'</p>').join(''))+pr function setRating(k,v){const x=f();x.ratingThresholds=x.ratingThresholds||{};x.ratingThresholds[k]=Number(v);save();render()}function setColor(k,v){if(!/^#[0-9a-f]{6}$/i.test(v))return;f().colors=f().colors||{};f().colors[k]=v;save();render()}function settings(x){const c=x.colors||(x.id==='washington-2029'?{primary:'#4b2e83',accent:'#b7a57a'}:{primary:'#234b84',accent:'#d1d5db'});return '<h2>Settings & backups</h2><div class="card"><h3>OVR rating colors</h3><p class="muted">90–99 Magenta · 85–89 Electric teal · 80–84 Gold · 75–79 Silver · 65–74 Bronze · 0–64 Gray. This palette is used across player cards.</p></div><div class="card"><h3>Franchise colors</h3><div class="row"><label>Primary <input type="color" value="'+esc(c.primary)+'" onchange="setColor(\'primary\',this.value)"></label><label>Accent <input type="color" value="'+esc(c.accent)+'" onchange="setColor(\'accent\',this.value)"></label></div><p class="muted">Colors follow the selected franchise.</p></div><div class="card"><p><b>Storage:</b> Saved locally by default. To sync across devices, sign in using Private cloud sync above and choose which save to use.</p><button class="primary" onclick="backup()">Export all franchises</button> <label>Import backup JSON</label><input type="file" accept=".json,application/json" onchange="restore(event)"><p class="muted">Import replaces all local franchises. Export a backup first.</p></div>'}

async function restore(e){try{const x=JSON.parse(await e.target.files[0].text());if(!Array.isArray(x)||!x.every(z=>z.id&&z.name&&Array.isArray(z.players)))throw Error('Invalid backup');if(!confirm('Replace all local franchises with this backup?'))return;data=x;selected=data[0].id;save();render()}catch(err){alert(err.message)}}

function seedBjornsonMedia(){const x=data.find(z=>z.id==='washington-2029');if(!x)return;let changed=false;x.mediaPersonalities=Array.isArray(x.mediaPersonalities)?x.mediaPersonalities:[];x.scribeArticles=Array.isArray(x.scribeArticles)?x.scribeArticles:[];x.firebirdPosts=Array.isArray(x.firebirdPosts)?x.firebirdPosts:[];const seed={"story":{"id":"scribe-2027-bjornson-washington","publicationId":"saturday-scribe","writerId":"mara-ellis","category":"Coaching","date":"2027-12-20","headline":"Two departures, one defining moment: Bjornson to Washington as Creighton takes Duke job","deck":"After a Big Ten title and a second straight playoff berth, Eastern Michigan's remarkable coaching partnership heads in two directions.","body":"YPSILANTI, Mich. — Eastern Michigan spent two seasons showing college football what an unlikely contender could become. Now the architects of that rise are taking their next steps elsewhere.\n\nLars Bjornson, the offensive coordinator who helped transform the Eagles into a national story, has accepted the same position at Washington under Jedd Fisch. Head coach Chris Creighton, whose long rebuild in Ypsilanti culminated in a Big Ten championship, is headed to Duke.\n\nThe timing is striking. In 2026, Eastern Michigan won the MAC and reached the College Football Playoff. After promotion to the Big Ten, the Eagles endured a turbulent 2027 regular season, then stunned No. 2 Ohio State 14–9 in the conference championship game. Their season ended in a 45–38 overtime playoff loss to No. 5 BYU — close enough to the next round to make the final play linger.\n\nFor Bjornson, Seattle offers a larger recruiting stage without the immediate burden of running an entire program. He will work with Fisch to shape a personnel-first offense, built around the strengths of the players rather than a rigid playbook. Washington plays in the Pac-12 in this universe following the 2026 western realignment, making the move a fresh competitive challenge rather than a return to the Big Ten.\n\nBjornson is not arriving alone. Offensive line coach Mike Kross is following him from Eastern Michigan, preserving a trusted partnership in the run game and protection schemes. No wider departure of Eagles assistants has been confirmed.\n\nCreighton's decision is a different kind of leap. He leaves behind a program he guided from a long rebuild to conference titles, two playoff appearances and a Big Ten crown in its first season at that level. At Duke, he will try to prove that the culture and toughness he built in Ypsilanti can travel.\n\nPeople familiar with the transition describe the two coaches' parting as supportive, not acrimonious. Their successes created opportunities that Eastern Michigan once could scarcely have imagined.\n\nThat is the paradox of a breakthrough season: the achievement that puts a program on the map can also make it harder to keep the people who put it there. Eastern Michigan now faces the challenge of sustaining its rise. Washington and Duke get to find out what happens when two of its most important voices start new chapters.\n\n— SATURDAY SCRIBE"},"writer":{"id":"mara-ellis","name":"Mara Ellis","role":"National college football insider · Saturday Scribe","bio":"Fictional national coaching-carousel and program-building reporter. Covers staffing moves, the people behind them, and the institutional stakes of college football.","voice":"Measured and well-sourced in tone; separates confirmed moves from speculation. Focuses on context and consequences rather than sensationalism."},"posts":[{"id":"fb-2027-move-1","date":"2027-12-20","handle":"@MaraEllisCFB","author":"Mara Ellis","type":"journalist","text":"Coaching carousel: Lars Bjornson is headed to Washington to coordinate Jedd Fisch's offense, while Chris Creighton takes the Duke job. Two exits after an extraordinary run at Eastern Michigan.","writerId":"mara-ellis"},{"id":"fb-2027-move-2","date":"2027-12-20","handle":"@EaglePrideForever","author":"Eagle Pride Forever","type":"recurring-fan","text":"We won the BIG TEN in our FIRST YEAR and now both Creighton and Bjornson are gone. Proud of them. Also staring at the ceiling."},{"id":"fb-2027-move-3","date":"2027-12-20","handle":"@PurpleRainCheck","author":"Purple Rain Check","type":"recurring-fan","text":"A coordinator who took Eastern Michigan to back-to-back CFPs? I'm listening. Welcome to Seattle, Coach Bjornson. #GoHuskies"},{"id":"fb-2027-move-4","date":"2027-12-20","handle":"@BlueDevilBacker27","author":"Blue Devil Backer","type":"one-off-fan","text":"Duke hiring the coach who just won the Big Ten with EASTERN MICHIGAN feels like a pretty strong statement of intent."},{"id":"fb-2027-move-5","date":"2027-12-20","handle":"@FilmRoomFrank","author":"Film Room Frank","type":"recurring-fan","text":"Underrated detail: Mike Kross is following Bjornson to Washington. Keeping the offensive line coach matters when your whole identity starts with protection and a physical run game."}]};if(!x.mediaPersonalities.some(z=>z.id===seed.writer.id)){x.mediaPersonalities.push(seed.writer);changed=true}if(!x.scribeArticles.some(z=>z.id===seed.story.id)){x.scribeArticles.push(seed.story);changed=true}for(const p of seed.posts)if(!x.firebirdPosts.some(z=>z.id===p.id)){x.firebirdPosts.push(p);changed=true}if(changed)localStorage.setItem(key,JSON.stringify(data))}

kson-hayes","name":"Jackson “Hammer” Hayes","role":"Linebackers Coach","team":"Eastern Michigan","notes":"Associated with Eastern Michigan following 2027; no confirmed departure.","history":[{"years":"2026–2027","team":"Eastern Michigan","role":"Linebackers Coach","headCoach":"Chris Creighton"}]}],"bio":"Born in 1990 in Traverse City, Michigan; three-sport captain at Traverse City West, son of the school's athletic director and baseball coach. Michigan State quarterback (redshirt 2009, starter 2012–2013), undrafted NFL practice-squad quarterback, Detroit Lions quality-control coach, Michigan State assistant, college-football TV analyst, then Eastern Michigan quarterbacks coach (2024), passing game coordinator (2025) and offensive coordinator (2026–2027). Joined Jedd Fisch at Washington after Eastern Michigan's 2027 Big Ten title. Personnel-first, physical pro-style spread: multiple formations and compact concepts, running game, RPO/play-action, quarterback autonomy. Source career narrative and year-by-year table disagree on some 2017–2021 dates; dates are left unresolved.","rule":{"id":"pac12-2026","title":"Washington plays in the Pac-12","body":"After the fall 2026 western regional realignment, Washington competes in the Pac-12, not the Big Ten. Eastern Michigan was promoted from the MAC into the Big Ten for 2027."},"source":"https://docs.google.com/document/d/1qOq5S66tMrBLIxopF-FvKSaWm2dA-7Jt3IfRDb2xu1k/edit"};let changed=false;x.universeHistory=Array.isArray(x.universeHistory)?x.universeHistory:[];x.universeRules=Array.isArray(x.universeRules)?x.universeRules:[];x.coachIndex=Array.isArray(x.coachIndex)?x.coachIndex:[];for(const h of seed.history)if(!x.universeHistory.some(z=>z.id===h.id)){x.universeHistory.push(h);changed=true}if(!x.universeRules.some(z=>z.id===seed.rule.id)){x.universeRules.push(seed.rule);changed=true}for(const c of seed.coaches)if(!x.coachIndex.some(z=>z.id===c.id||z.name===c.name)&&!(x.staff||[]).some(z=>z.id===c.id||z.name===c.name)){x.coach ed. A future Saturday Scribe position is an aspiration, not a confirmed career move.","voice":"Detailed film study and tactical explanation.","publicationId":"eastern-echo","career":[{"year":"2026","publication":"The Eastern Echo","role":"EMU beat"},{"year":"2027–2028","publication":"Unrecorded","role":"No confirmed move"}]},{"id":"marcus-mac-holloway","name":"Marcus “Mac” Holloway","role":"Detroit Free Press columnist / storyteller","bio":"Detroit Free Press writer documented in 2026, 2027 and 2028. Follows Lars Bjornson selectively through legacy, relationships and career-defining moments.","voice":"Personal, reflective, interview-driven storytelling.","publicationId":"detroit-free-press","career":[{"year":"2026–2028","publication":"Detroit Free Press","role":"Columnist"}]},{"id":"elena-rossi","name":"Elena Rossi","role":"Detroit News accountability reporter","bio":"Documented at The Detroit News in 2026. Later assignments are unrecorded; remains available for accountability coverage without an assumed promotion.","voice":"Investigative scrutiny of contracts, spending, recruiting, NIL and institutions.","publicationId":"detroit-news","career":[{"year":"2026","publication":"The Detroit News","role":"Accountability"},{"year":"2027–2028","publication":"Unrecorded","role":"No confirmed move"}]},{"id":"javi-ramirez","name":"Javi “J-Rock” Ramirez","role":"Northern Star campus pulse writer","bio":"Established Northern Illinois campus voice in 2026. Later assignments are unrecorded.","voice":"Fast, energetic campus reporting.","publicationId":"northern-star","career":[{"year":"2026","publication":"The Northern Star","role":"NIU campus"},{"year":"2027–2028","publication":"Unrecorded","role":"No confirmed move"}]},{"id":"sarah-jenkins","name":"Sarah Jenkins","role":"Daily Chronicle community reporter","bio":"Documented as a DeKalb community voice at the Daily Chronicle in 2026. Later assignments are unrecorded.","voice":"Local community connections and people-first reporting.","publicationId":"daily-chronicle","career":[{"year":"2026","publication":"Daily Chronicle","role":"DeKalb community"},{"year":"2027–2028","publication":"Unrecorded","role":"No confirmed move"}]},{"id":"dorian-vance","name":"Dorian Vance","role":"Rockford Register Star predictive analyst","bio":"Documented as a predictive-modeling voice at the Rockford Register Star in 2026. Later assignments are unrecorded.","voice":"Quantitative analysis, probabilities and predictive models.","publicationId":"rockford-register-star","career":[{"year":"2026","publication":"Rockford Register Star","role":"Predictive modeling"},{"year":"2027–2028","publication":"Unrecorded","role":"No confirmed move"}]}]};x.publications=Array.isArray(x.publications)?x.publications:[];x.mediaPersonalities=Array.isArray(x.mediaPersonalities)?x.mediaPersonalities:[];let changed=false;for(const p of seed.publications)if(!x.publications.some(z=>z.id===p.id||z.name===p.name)){x.publications.push(p);changed=true}for(const w of seed.writers)if(!x.mediaPersonalities.some(z=>z.id===w.id||z.name===w.name)){x.mediaPersonalities.push(w);changed=true}if(changed)localStorage.setItem(key,JSON.stringify(data))}

function seedBjornsonArticleArchive(){const x=data.find(z=>z.id==='washington-2029');if(!x)return;const articles=[{"id":"archive-2028-oregon-standard","publicationId":"saturday-scribe","writerId":"saturday-scribe-national-desk","category":"Analysis","date":"2028","headline":"Oregon still owns the standard Washington is chasing","deck":"The No. 1 Ducks turned a blocked kick and a pick-six into a 38–17 repeat win, leaving Lars Bjornson and the Huskies with a 10-win season—and a clear offseason problem.","body":"PAC-12 CHAMPIONSHIP — Oregon did more than deny Washington a conference title. It showed the Huskies, for the second time this season, exactly how much ground remains between a rising program and the nation’s No. 1 team.\n\nThe final was Oregon 38, Washington 17. The score suggests a rout, but the shape of the game matters. Washington led 10–7 in the second quarter, reached halftime down only seven and received enough early work from its defense to build a different kind of night. What it never found was an offensive plan capable of sustaining pressure once Oregon began landing its counterpunches.\n\nThe warning came on the opening possession. Washington drove into range for a 45-yard field goal, only for Oregon to block the kick and return it for a touchdown. The Huskies’ defense answered. It intercepted Oregon and handed the offense the ball at the Ducks’ 18, then forced two more punts while the game remained tight. Washington managed only a field goal from that short field.\n\nIts best drive looked like the formula Bjornson needed all night. Kenneth Moore III and receiver C. Silver kept Washington on schedule, the offensive line delivered on fourth-and-1 in the red zone, and Moore converted another fourth-and-2 before scoring from the 1. The Huskies had a 10–7 lead and, briefly, control of the game’s terms.\n\nOregon took those terms away before halftime. The Ducks scored a touchdown with 1:15 left in the second quarter, forced a Washington punt and added a 50-yard field goal with four seconds remaining. A Washington lead became a 17–10 deficit in a little more than a minute of game time.\n\nThe separation arrived after the break. Washington punted to open the half, Oregon extended the lead to 24–10, and Jaron-Keawe Sagapolutele’s underthrown deep ball was returned for a touchdown late in the third quarter. At 31–10, the Huskies were no longer choosing their offense. They were chasing the game.\n\nThat is the uncomfortable part for Bjornson. Washington involved its best players, but it did not consistently create advantages for them. Moore carried 21 times for 86 yards and two touchdowns and caught five passes for 36 yards. B. Jennings caught seven passes for 61 yards, and Silver added five receptions for 30. Sagapolutele completed 23 of 32 passes, yet those completions produced only 174 yards, no touchdowns and no gain longer than 28 yards.\n\nPossession without strain is not the same as control. Washington converted two of 11 third downs, averaged 4.0 yards per play and finished with 247 total yards. Oregon gained 388 yards on only 46 plays—8.4 per snap—and paired that efficiency with two non-offensive touchdowns. Those returns accounted for 14 points in a 21-point game, but they were not the only difference.\n\nMoore scored again in the fourth quarter, and Oregon answered immediately. Washington’s final deep attempt was intercepted, the last act of a passing game pushed toward desperation without first establishing an explosive answer.\n\nThe loss should not erase the season. Washington is 10–3 and reached the Pac-12 championship in Bjornson’s first year coordinating the offense. That is real progress. So is the evidence Oregon supplied. The Ducks beat Washington 42–24 during the regular season and 38–17 with the title at stake. Across two meetings, the Huskies never forced Oregon to abandon its preferred game.\n\nFor Washington, the offseason question is no longer whether Bjornson’s system can produce a winning team. It can. The question is whether he can build the answers required when a defense takes away the comfortable calls, the margin disappears and the opponent’s talent turns every mistake into points.\n\nOregon left with the trophy. Washington left with something less satisfying, but nearly as useful: an exact picture of the standard it has not yet reached.","source":"Lars Bjornson Universe Google Doc"},{"id":"archive-2026-new-offense","publicationId":"detroit-free-press","writerId":"marcus-mac-holloway","category":"Season Preview","date":"2026","headline":"A new offense, familiar values: Why Eastern Michigan's 2026 season feels bigger than one playbook","deck":"","body":"There are football seasons built on hype.\n\nThen there are seasons built on trust.\n\nEastern Michigan enters 2026 with very little national attention, no preseason All-Americans, and none of the transfer portal fireworks that dominate the headlines every January. That's nothing new in Ypsilanti.\n\nWhat is new is the quiet confidence surrounding a program that knows exactly who it wants to be.\n\nChris Creighton has spent more than a decade building Eastern Michigan by resisting shortcuts. While much of college football chases the newest trend, Creighton's teams have always reflected something older: toughness, continuity and accountability.\n\nThis season may be the clearest expression of that philosophy yet.\n\nThe headline change is obvious. Lars Bjornson steps into his first season as offensive coordinator after serving as quarterbacks coach and passing game coordinator. His offense promises more modern spread concepts, more RPOs and more opportunities for explosive plays.\n\nBut reducing this season to \"new offense\" misses the point.\n\nThis isn't a revolution.\n\nIt's an evolution.\n\nBjornson's system still begins where Creighton believes winning football begins—with the offensive line, the running game and quarterbacks who protect the football before they chase highlight throws.\n\nThat's why senior Noah Kim may be the most important player on the roster.\n\nNot because he'll throw for 4,000 yards.\n\nNot because he'll become the face of the conference.\n\nBecause he's been in the building long enough to understand what this offense is asking him to do.\n\nQuarterbacks often receive too much credit when things go right and too much blame when they don't. Veterans understand the job is much simpler than that.\n\nKeep the offense on schedule.\n\nGet the team into the right play.\n\nProtect possessions.\n\nLet the system work.\n\nKim enters his third season working alongside Bjornson, and that familiarity matters. The freedom to change protections, recognize defensive leverage and check into favorable run concepts isn't handed out on Day One. It's earned over years of meetings, practices and mistakes.\n\nThat veteran presence extends throughout the offense.\n\nBraydon Bennett gives Eastern Michigan a dependable downhill runner capable of wearing defenses down over four quarters. Joey Mattord provides change-of-pace explosiveness. Nick Devereaux has emerged as the receiver opponents will circle before kickoff, while Harold Mack, Benson Prosper and tight end Tanner Lemaster give Kim experienced targets underneath.\n\nPerhaps the biggest advantage isn't star power.\n\nIt's age.\n\nThis offense is filled with seniors who have played enough football to know that every game unfolds differently. Sometimes the defense dares you to throw. Sometimes it loads the box and invites the ball outside. Good veteran offenses don't argue with what the defense is giving them.\n\nThey simply take it.\n\nThat mindset has quietly become one of Eastern Michigan's strengths.\n\nThe defense faces a different challenge.\n\nRyan Lester inherits a group that appears strongest along the edge and in the secondary but thinner at linebacker. That reality means creativity becomes almost as important as talent.\n\nFortunately, Lester has built his reputation around disguise.\n\nExpect multiple fronts. Expect safeties moving late. Expect hybrid defenders appearing in places quarterbacks don't expect.\n\nThe goal isn't confusion for confusion's sake.\n\nIt's forcing hesitation.\n\nAnd hesitation wins football games.\n\nEastern Michigan won't overwhelm many opponents with recruiting rankings.\n\nIt probably won't have the biggest roster in the conference.\n\nBut it has something coaches value just as highly.\n\nIt knows exactly who it is.\n\nIn today's college football landscape, where rosters can change dramatically every offseason, continuity has become a competitive advantage. The Eagles return experienced leaders on offense, maintain stability at head coach and now introduce an offensive coordinator whose philosophy complements the culture already established inside the program.\n\nThat combination doesn't guarantee championships.\n\nIt rarely does.\n\nBut it gives Eastern Michigan something every coach wants entering August:\n\nA team that understands its identity before adversity arrives.\n\nThere will be games where the offense stalls, afternoons when the defense bends too far, and Saturdays where talent alone won't be enough. That's life in the Mid-American Conference.\n\nYet programs are ultimately judged less by how they begin than by how they respond.\n\nCreighton's best teams have always improved as the season unfolded.\n\nIf this one follows that pattern, don't be surprised if November once again finds Eastern Michigan playing meaningful football—with a veteran quarterback, a balanced offense and a program that continues proving there is still room in college football for patience, development and doing things the hard way.","source":"Lars Bjornson Universe Google Doc"},{"id":"archive-2026-sacramento-preview","publicationId":"detroit-free-press","writerId":"marcus-mac-holloway","category":"Game Preview","date":"2026","headline":"Eastern Michigan opens Lars Bjornson era against dangerous Sacramento State backfield","deck":"","body":"YPSILANTI — Eastern Michigan’s 2026 season begins with a matchup that looks comfortable on paper but carries enough danger to demand the Eagles’ full attention.\n\nSacramento State arrives at Rynearson Stadium as a 71-overall team, considerably less talented from top to bottom than the Eagles. The Hornets, however, possess several experienced offensive playmakers capable of turning a routine opener into an uncomfortable afternoon.\n\nFor Eastern Michigan, the game also represents the first official test for new offensive coordinator and quarterbacks coach Lars Bjornson, who joins veteran head coach Chris Creighton’s staff with an experienced offense built to adjust to whatever a defense concedes.\n\nThe plan should begin with senior quarterback Noah Kim, a 76-overall pocket passer entering his third season working with Bjornson. Kim will not be asked to manufacture difficult plays. His primary responsibilities will be protecting the football, identifying favorable matchups and allowing Eastern Michigan’s veteran skill players to carry the offense.\n\nSacramento State’s backfield demands attention\n\nThe most dangerous Hornet is senior running back Jamar Curtis, an 80-overall east-west playmaker whose acceleration may be more concerning than his top-end speed.\n\nCurtis has 92 acceleration, 89 agility and 88 change of direction. At 5-foot-8 and 169 pounds, he is unlikely to overpower Eastern Michigan’s defense, but he can punish poor pursuit angles and turn short completions into explosive gains.\n\nSacramento State also has two additional running backs rated 76 overall, junior B. Collins and redshirt sophomore C. Rhaney. That gives the Hornets enough depth to rotate backs and test an Eastern Michigan linebacker unit considered the weakest portion of its defense.\n\nThe Eagles’ defensive front is solid on the edges, led by Evans and Adam, both rated 76 overall. The larger concern is behind them. Eastern Michigan’s projected starting linebackers are rated 72, 69 and 64 overall, leaving the Eagles potentially vulnerable to outside runs, screens and running backs matched against linebackers in space.\n\nThat makes disciplined pursuit essential. Curtis does not need much room, and Eastern Michigan cannot allow Sacramento State to turn checkdowns into chunk plays.\n\nConklin is accurate but limited vertically\n\nSacramento State quarterback Carson Conklin enters the opener at 73 overall. He is not an elite passer, but his ratings suggest a quarterback capable of keeping the Hornets on schedule.\n\nConklin owns an 85 short-throw accuracy rating and an 84 medium-throw rating. He is also reasonably comfortable outside the pocket, with a 77 throw-on-the-run rating, and has several useful physical abilities, including Step Up, Sleight of Hand, Dot and On Time.\n\nHis greatest limitation is the deep ball. Conklin’s 75 deep accuracy makes him less threatening vertically than underneath, where Sacramento State can lean on Curtis and senior tight end J. Williams.\n\nWilliams may be the Hornets’ most difficult matchup after Curtis. The 79-overall senior tight end combines 82 speed, 85 acceleration, 72 strength and 82 awareness. Against an Eastern Michigan defense with questions at linebacker, Williams could become Conklin’s preferred target on play-action passes, crossing routes and third downs.\n\nSenior receiver M. Coleman, rated 76 overall, brings another explosive element with 89 speed, 91 acceleration and 88 agility. Eastern Michigan’s strong safety tandem should allow the Eagles to keep Coleman in front of them while dedicating additional attention to Sacramento State’s underneath threats.\n\nEagles should establish the run\n\nEastern Michigan’s offense enters the season with a clear identity: experienced, adaptable and determined to make the defense declare its intentions.\n\nSenior running back Braydon Bennett, a 79-overall contact seeker, gives the Eagles a downhill runner capable of establishing physical control. Joey Mattord provides the changeup as the more agile, east-west option.\n\nExpect Bjornson to begin by testing Sacramento State between the tackles. The Hornets’ best defensive lineman appears to be senior tackle B. Summers, a 77-overall player with 88 strength and 84 awareness. He can anchor the middle, but the remainder of Sacramento State’s defense lacks comparable top-end talent.\n\nEastern Michigan’s offensive line is led by senior center Nick Gallegos, a pass protector and the unit’s emotional leader. The Eagles are experienced at right guard and right tackle, with seniors Tyler McMillan and Josh Anderson, but less proven on the left side.\n\nA productive running game would simplify the afternoon for Kim and create favorable opportunities for Eastern Michigan’s most dangerous offensive player.\n\nNick Devereaux is the matchup Sacramento State must solve\n\nSenior receiver Nick Devereaux is the centerpiece of Bjornson’s passing attack.\n\nThe 6-foot-1, 190-pound speedster from Parma has the ability to separate downfield and make difficult catches outside his frame. If Sacramento State commits additional defenders to stopping Bennett, Eastern Michigan will be ready to attack vertically with Devereaux.\n\nSophomore Harold Mack, a 77-overall elusive route runner, gives Kim a dependable secondary option underneath. Senior Benson Prosper and tight end Tanner Lemaster round out a receiving group that should be able to spread the field horizontally and force Sacramento State to defend every area.\n\nThe Eagles do not need Kim to chase big plays. They need him to identify what Sacramento State is willing to surrender, distribute the ball accordingly and remain patient.\n\nThree keys for Eastern Michigan\n\nContain Curtis on the perimeter. Eastern Michigan’s edge defenders and safeties must maintain leverage and prevent Sacramento State’s best player from reaching open space.\n\nForce Conklin to throw deep. The Hornets would prefer an efficient short passing game. Taking away Curtis and Williams underneath would force Conklin toward the weakest portion of his skill set.\n\nAvoid opening-week mistakes. Sacramento State should not be able to match Eastern Michigan’s depth over four quarters. Turnovers, missed tackles and special-teams errors are the clearest path to an upset.\n\nPrediction\n\nSacramento State has enough veteran offensive talent to challenge Eastern Michigan early, particularly if Curtis finds favorable matchups against the Eagles’ linebackers. But Eastern Michigan holds advantages along the offensive line, at wide receiver and in the secondary.\n\nBjornson’s offense may begin conservatively, leaning on Bennett and asking Kim to make high-percentage decisions. Once Sacramento State crowds the box, Devereaux should find opportunities behind the defense.\n\nEastern Michigan 31, Sacramento State 17","source":"Lars Bjornson Universe Google Doc"},{"id":"archive-2026-san-jose-state","publicationId":"detroit-free-press","writerId":"marcus-mac-holloway","category":"Game Story","date":"2026","headline":"Eastern Michigan’s defense writes the final word in 27–7 win over San Jose State","deck":"","body":"YPSILANTI — For one quarter Saturday, Eastern Michigan looked ready to turn a football game into a statement.\n\nThen the offense stalled, the afternoon became untidy, and the Eagles were reminded that winning teams are not always carried by the side of the ball receiving the most attention.\n\nEastern Michigan beat San Jose State 27–7 because its defense refused to let an imperfect offensive day become a dangerous one.\n\nNick Devereaux gave new offensive coordinator Lars Bjornson the fast start he wanted, catching two first-quarter touchdown passes from Noah Kim. The senior receiver finished with nine catches for 66 yards and became the steady answer whenever the Eagles needed one.\n\nBut after building a 21–0 halftime lead, Eastern Michigan never delivered the offensive knockout. Kim finished 19-of-28 for 143 yards, two touchdowns and two interceptions. The running game managed 100 yards on 38 carries, and several second-half possessions disappeared without threatening the end zone.\n\nEach time the offense cracked the door open, the defense slammed it shut.\n\nJ. Adam spent the afternoon in the San Jose State backfield, recording three sacks and three tackles for loss. Caleb Coley added an interception, and the Eagles repeatedly turned away the Spartans on fourth down. San Jose State managed only 224 total yards and never mounted the kind of sustained response that makes a comfortable lead feel fragile.\n\nThat is the encouraging part of Eastern Michigan’s 2–0 start. Bjornson’s offense is still learning how to finish games, but it has not been asked to learn alone.\n\nDevereaux looks like a dependable centerpiece. Right tackle Josh Anderson delivered 10 pancake blocks without allowing a sack. Kicker Rudy Kessinger converted field goals from 46 and 30 yards when drives stalled.\n\nThe Eagles were not sharp for four quarters. They were, however, composed enough to let their defense carry the burden.\n\nIn September, that counts as progress. By November, Bjornson will want it to look like something more.","source":"Lars Bjornson Universe Google Doc"},{"id":"archive-2027-emu-coaching-departures","publicationId":"eastern-echo","writerId":"casey-evans","category":"Coaching","date":"2027","headline":"End of an era in Ypsilanti: Creighton and Bjornson leave Eastern Michigan for new jobs","deck":"Bjornson is headed to Washington as offensive coordinator, while Creighton will take over Duke’s program","body":"YPSILANTI — The two coaches most responsible for turning Eastern Michigan’s rise from an improbable story into a sustainable football program are moving on.\n\nHead coach Chris Creighton has accepted the head-coaching position at Duke after more than a decade at Eastern Michigan. Offensive coordinator Lars Bjornson has been hired by Washington to lead the Huskies’ offense under head coach Jedd Fisch.\n\nThe departures arrive after the greatest two-season stretch in modern Eastern Michigan history: consecutive College Football Playoff appearances, a conference championship, promotion into the Big Ten and a Big Ten title in the Eagles’ first season at that level. The 2027 run ended in a 45–38 overtime loss at No. 5 BYU, but it also confirmed that the program Creighton built—and the offense Bjornson modernized—had become nationally relevant.\n\nTwo departures, one shared ascent\n\nCreighton’s part of the story is the larger one. He did not inherit a stable program and merely improve it. He built the stability. The culture, recruiting base and expectation that Eastern Michigan could win difficult games all existed before Bjornson became offensive coordinator.\n\nBjornson’s contribution was to give that established identity a modern offensive language. His system kept the physical running game and personnel flexibility Creighton valued, then attached RPOs, play-action, formation variation and more quarterback autonomy. The offense changed without separating itself from the program around it.\n\nThat relationship helps explain why the exits should not be treated as a rupture. Bjornson did not outgrow Creighton by rejecting his football. He earned the Washington opportunity by proving that Creighton’s values could travel inside a more adaptable system.\n\nWhat Bjornson takes to Washington\n\nWashington offers Bjornson a larger recruiting platform, greater resources and the chance to work inside Fisch’s multiple offense. It also gives him another developmental step before the head-coaching opportunity that has always appeared to be his long-term destination.\n\nThe schematic translation will be worth watching. Eastern Michigan’s offense was built to create answers without requiring elite talent at every position. Washington will give Bjornson more speed and more matchup advantages, but it will also bring greater expectations and defenses with the personnel to survive conflict plays.\n\nOffensive line coach Mike Kross will follow Bjornson to Seattle, giving the new coordinator one trusted lieutenant who already understands the protection system and the physical run-game foundation. That matters. Bjornson can expand the presentation without rebuilding the language from zero.\n\nWhat Creighton takes to Duke\n\nDuke is not hiring Creighton to install a novelty. It is hiring him to construct an identity. His Eastern Michigan tenure showed he can survive the slow years, develop overlooked players and turn internal standards into visible results. At Duke, that patience will be tested against the week-to-week demands of a larger stage.\n\nFor Creighton, the move is both a reward and a risk. He leaves a program built in his image for one with more resources and a broader platform, but without the institutional equity he accumulated in Ypsilanti. Duke is betting that his culture can travel. Creighton is betting that his best work was not limited to one place.\n\nWhat Eastern Michigan must replace\n\nEastern Michigan is not replacing only a head coach and a play-caller. It is replacing the partnership between the program’s identity and its weekly problem-solving.\n\nCreighton decided what the Eagles were supposed to value. Bjornson helped determine how those values could attack a specific opponent. One established the non-negotiables; the other kept defenses from becoming comfortable against them.\n\nThe next staff will inherit stronger expectations than either man did. That is the benefit of their success and the burden it leaves behind. Competing for bowl eligibility will no longer feel like sufficient evidence of progress after Eastern Michigan has won the Big Ten and played into December twice.\n\nFor the players, the immediate questions will concern continuity: which assistants remain, which schemes survive and whether the roster believes the next version of Eastern Michigan football can preserve the standards that made these opportunities possible.\n\nFor the university, the decision is more fundamental. It must decide whether this era was the peak of one remarkable coaching partnership or proof that Eastern Michigan has become a place where the next successful partnership can begin.\n\nReporting, not rooting: Creighton and Bjornson earned the right to take larger swings. Eastern Michigan now has to prove that their ambition changed more than two résumés.\n\n— THE EASTERN ECHO —","source":"Lars Bjornson Universe Google Doc"},{"id":"archive-2026-emu-offense-preview","publicationId":"eastern-echo","writerId":"casey-evans","category":"Analysis","date":"2026","headline":"New system, veteran offense give Eastern Michigan an intriguing path in 2026","deck":"First-year offensive coordinator Lars Bjornson will pair a physical running game with RPOs, play-action and increased freedom for senior quarterback Noah Kim","body":"Eastern Michigan’s offense can be summarized in three lines:\n\nRun with numbers. Throw with leverage. Attack vertically when defenses flinch.\n\nThe challenge in 2026 will be turning that philosophy into something the Eagles can execute consistently.\n\nNew offensive coordinator Lars Bjornson is not installing a giant playbook filled with unrelated concepts. His offense is built around a smaller group of core runs and passes presented through multiple formations and personnel groupings.\n\nThe goal is simple for Eastern Michigan and complicated for the defense.\n\nBjornson enters his first season as offensive coordinator after joining Chris Creighton’s staff as quarterbacks coach in 2024 and serving as passing game coordinator in 2025. His system reflects the balanced, pro-style football he played at Michigan State, but it also incorporates spread formations, RPOs and modern play-action concepts.\n\nSenior quarterback Noah Kim will be responsible for making it work.\n\nKim is a 76-overall pocket passer entering his third season with Bjornson. That experience should matter in a system that gives veteran quarterbacks more control at the line of scrimmage. Bjornson expects senior quarterbacks to recognize defensive structure, manage protections and move between run and pass concepts before the snap.\n\nKim does not need to become a featured runner. He needs to become an extension of the offensive coordinator.\n\nThe running game should make those decisions easier.\n\nBraydon Bennett, a 79-overall contact seeker, gives Eastern Michigan a downhill option. Joey Mattord provides the contrasting style as a more agile, east-west playmaker. Together, they give the Eagles the “smash and dash” backfield Bjornson’s offense is designed to use.\n\nThe core rushing package includes inside zone, duo, counter, split zone and power. The idea is to establish the run without becoming predictable.\n\nThat is where the RPO game enters.\n\nBjornson does not use RPOs to replace the running game. He uses them to punish defenders who overcommit to stopping it. Bubble screens, glances, hitches, sticks and quick outs can all be attached to the same concepts Eastern Michigan wants to run between the tackles.\n\nWhen linebackers and safeties begin creeping forward, the Eagles want to attack behind them.\n\nSenior receiver Nick Devereaux is the player best equipped to do it.\n\nDevereaux is the top player on Eastern Michigan’s offense. The 6-foot-1, 190-pound receiver from Parma, Michigan, has the speed to separate vertically and the ability to finish difficult catches.\n\nThe run game is supposed to make the defense flinch. Devereaux is supposed to make it pay.\n\nBjornson’s explosive passing concepts include Yankee, Mills, four verticals, deep cross and post-wheel. His play-action passes are designed to look like the Eagles’ core runs long enough to create hesitation in the secondary.\n\nDevereaux’s vertical presence should also create opportunities underneath for sophomore Harold Mack, a 77-overall elusive route runner, senior Benson Prosper and senior tight end Tanner Lemaster.\n\nEastern Michigan will primarily operate from 11 personnel, but Bjornson’s system also includes fullback packages, two-tight-end sets, split backs, empty formations and heavier short-yardage looks. The personnel may change, but the concepts should remain familiar to the players.\n\nThe offensive line will determine how much of that flexibility is usable.\n\nSenior center Nick Gallegos is the leader of the unit. The Naperville, Illinois, native is joined by junior left tackle Tyler Brumfield, junior left guard Cole Dellinger, senior right guard Tyler McMillan and senior right tackle Josh Anderson.\n\nThat group must handle both physical downhill runs and more athletic blocking schemes without losing consistency.\n\nDefensively, Eastern Michigan appears strongest on the edges and in the secondary.\n\nDefensive ends Evans and Adam are both rated 76 overall, while safeties Llewellyn and Manning are each rated 77. Corners Coley and Dobbs give defensive coordinator Ryan Lester enough stability to vary his coverage looks.\n\nThe concern is linebacker.\n\nMowchan leads the group at 72 overall, followed by Eliuk at 69 and Main at 64. Opponents will likely try to isolate that unit with spread formations, tight ends and receiving backs.\n\nLester’s hybrid 4-3 and 4-2-5 system may help protect it. His defense uses a Star position, disguised rotations and multiple fronts to create uncertainty without constantly changing personnel.\n\nThe Eagles are not built around elite talent at every position. They are built around experience, defined roles and systems designed to create conflict.\n\nOffensively, Bjornson must make defenses choose between stopping Bennett, respecting Kim’s RPO reads and preventing Devereaux from getting behind them.\n\nDefensively, Lester must use his safeties and edge players to cover for weaknesses through the middle.\n\nReporting, not rooting: Bjornson’s offense remains theoretical until it works against a live defense.\n\nBut the identity is already clear.\n\nPhysical without being predictable. Balanced without being conservative. Simple for Eastern Michigan, complicated for everyone else.","source":"Lars Bjornson Universe Google Doc"}];x.scribeArticles=Array.isArray(x.scribeArticles)?x.scribeArticles:[];x.mediaPersonalities=Array.isArray(x.mediaPersonalities)?x.mediaPersonalities:[];let changed=false;if(!x.mediaPersonalities.some(z=>z.id==='saturday-scribe-national-desk')){x.mediaPersonalities.push({id:'saturday-scribe-national-desk',name:'The Saturday Scribe National Desk',role:'National college football editorial desk',bio:'Collective byline for national reporting and analysis; not a named individual journalist.',voice:'National scope, clear analysis and historical context.',publicationId:'saturday-scribe'});changed=true}for(const a of articles)if(!x.scribeArticles.some(z=>z.id===a.id)){x.scribeArticles.push(a);changed=true}if(changed)localStorage.setItem(key,JSON.stringify(data))}
